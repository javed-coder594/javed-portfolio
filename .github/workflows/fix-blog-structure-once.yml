name: Fix Blog Structure Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[blog-structure-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize every blog article
        shell: python
        run: |
          from pathlib import Path
          import re
          root=Path('.')
          labels={'technical-seo':'Technical SEO','on-page-seo':'On-Page SEO','off-page-seo':'Off-Page SEO','local-seo':'Local SEO','wordpress-seo':'WordPress SEO','web-development':'Web Development'}
          style='''<style id="blog-consistency-style">.blog-article .blog-post-content{max-width:900px;margin:0 auto;padding:150px 20px 90px}.blog-article .blog-post-content>h1{margin:0 0 28px;line-height:1.15;font-size:clamp(32px,4vw,52px)}.blog-article .blog-consistency-hero{margin:0 0 42px}.blog-article .blog-consistency-hero img{display:block;width:100%;height:auto;aspect-ratio:1200/650;object-fit:cover;border-radius:20px}.blog-article .blog-consistency-hero figcaption{margin-top:10px;color:var(--text);font-size:14px;line-height:1.6;text-align:center}.blog-article .blog-consistency-meta{margin:0 0 28px;line-height:1.6}.blog-article .blog-post-content>p{margin:0 0 20px;line-height:1.85}.blog-article .blog-post-content>h2{margin:42px 0 16px;line-height:1.3}.blog-article .blog-post-content>h3{margin:28px 0 10px;line-height:1.35}@media(max-width:600px){.blog-article .blog-post-content{padding:120px 18px 60px}.blog-article .blog-post-content>h1{margin-bottom:22px}.blog-article .blog-post-content>h2{margin-top:34px}.blog-article .blog-consistency-hero{margin-bottom:32px}}</style>'''
          footer='''<footer class="footer"><div class="container"><div class="footer-grid"><div class="footer-col"><a href="/" class="footer-logo"><span>J</span>aved</a><p>SEO Executive and WordPress Developer helping businesses improve online visibility, website performance, and organic growth.</p></div><div class="footer-col"><h3>Quick Links</h3><ul><li><a href="/#home">Home</a></li><li><a href="/#about">About</a></li><li><a href="/#experience">Experience</a></li><li><a href="/#skills">Skills</a></li><li><a href="/#projects">Projects</a></li><li><a href="/#achievements">Achievements</a></li><li><a href="/blog/">Blog</a></li><li><a href="/#contact">Contact</a></li></ul></div><div class="footer-col"><h3><a href="/blog/">Blogs</a></h3><ul><li><a href="/blog/technical-seo/">Technical SEO</a></li><li><a href="/blog/on-page-seo/">On-Page SEO</a></li><li><a href="/blog/off-page-seo/">Off-Page SEO</a></li><li><a href="/blog/local-seo/">Local SEO</a></li><li><a href="/blog/wordpress-seo/">WordPress SEO</a></li><li><a href="/blog/web-development/">Web Development</a></li></ul></div><div class="footer-col"><h3>Contact</h3><ul><li><i class="fas fa-envelope"></i> javedchaudhary594@gmail.com</li><li><i class="fas fa-phone"></i> +91 9390988594</li><li><i class="fas fa-location-dot"></i> Hyderabad, India</li></ul></div></div><div class="footer-bottom"><p>© 2026 <span>Javed Chaudhary</span>. All Rights Reserved.</p></div></div></footer>'''
          for p in sorted(root.glob('blog/*/*.html')):
            if p.name=='index.html' or p.parts[1] not in labels: continue
            d=p.read_text(encoding='utf-8')
            d=re.sub(r'<style id="blog-consistency-style">.*?</style>','',d,flags=re.S)
            am=re.search(r'<article\b[^>]*>(.*?)</article>',d,re.S)
            if not am: continue
            inner=am.group(1)
            h=re.search(r'<h1\b[^>]*>.*?</h1>',inner,re.S)
            fig=re.search(r'<figure class="blog-consistency-hero">.*?</figure>',inner,re.S)
            meta=re.search(r'<p[^>]*><strong>'+re.escape(labels[p.parts[1]])+r'</strong>\s*·\s*Written by Javed Chaudhary</p>',inner,re.S)
            if not h or not fig: continue
            h1=h.group(0); figure=fig.group(0); meta_html=meta.group(0) if meta else '<p class="blog-consistency-meta"><strong>'+labels[p.parts[1]]+'</strong> · Written by Javed Chaudhary</p>'
            for block in (h1,figure,meta_html): inner=inner.replace(block,'',1)
            new_inner='\n'+h1+'\n'+figure+'\n'+meta_html.replace('<p>','<p class="blog-consistency-meta">',1) if 'class="blog-consistency-meta"' not in meta_html else '\n'+h1+'\n'+figure+'\n'+meta_html
            new_inner+= '\n'+inner.strip()+'\n'
            article='<article class="container blog-post-content" data-visuals-ready="true">'+new_inner+'</article>'
            d=d[:am.start()]+article+d[am.end():]
            url='https://javed-portfolio-jade.vercel.app/blog/'+'/'.join(p.parts[1:]).replace('.html','')+'/'
            d=re.sub(r'<link rel="canonical" href="[^"]+">','<link rel="canonical" href="'+url+'">',d,count=1)
            d=re.sub(r'<footer class="footer">.*?</footer>','',d,flags=re.S)
            d=re.sub(r'<script src="/js/script\.js"></script>','',d)
            d=d.replace('</head>',style+'</head>',1)
            d=d.replace('</body>',footer+'<script src="/js/script.js"></script></body>',1)
            p.write_text(d,encoding='utf-8')
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/*/*.html .github/workflows/fix-blog-structure-once.yml
          git rm .github/workflows/fix-blog-structure-once.yml
          git commit -m "Normalize blog H1 image content structure and spacing [blog-structure-fixed]"
          git push
