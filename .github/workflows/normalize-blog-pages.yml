name: Normalize Blog Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[blog-normalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix article visuals
        shell: python
        run: |
          from pathlib import Path
          import hashlib, html, re

          root = Path('.')
          labels = {
            'technical-seo':'Technical SEO','on-page-seo':'On-Page SEO','off-page-seo':'Off-Page SEO',
            'local-seo':'Local SEO','wordpress-seo':'WordPress SEO','web-development':'Web Development'
          }

          def make_svg(path, title, label):
            digest = hashlib.sha256(path.as_posix().encode()).hexdigest()
            accent = ['#FFD400','#4C9AFF','#7EE787','#C084FC'][int(digest[:2],16)%4]
            variant = int(digest[2:4],16)%4
            motifs = [
              f'<path d="M735 405 L805 330 L865 365 L945 250 L1020 300" fill="none" stroke="{accent}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1020" cy="300" r="13" fill="{accent}"/>',
              f'<circle cx="880" cy="315" r="92" fill="none" stroke="#2A3442" stroke-width="24"/><path d="M880 315 L945 250" stroke="{accent}" stroke-width="14" stroke-linecap="round"/><circle cx="880" cy="315" r="14" fill="{accent}"/>',
              f'<circle cx="785" cy="300" r="34" fill="{accent}"/><circle cx="1010" cy="245" r="28" fill="{accent}"/><circle cx="900" cy="390" r="30" fill="#9AA9BD"/><path d="M810 300 L875 375 L980 250" fill="none" stroke="#E8EEF6" stroke-width="8"/>',
              f'<rect x="750" y="210" width="260" height="150" rx="16" fill="none" stroke="{accent}" stroke-width="10"/><path d="M790 410 H970" stroke="#9AA9BD" stroke-width="10" stroke-linecap="round"/><path d="M820 255 H940 M820 290 H900" stroke="#E8EEF6" stroke-width="10" stroke-linecap="round"/>'
            ][variant]
            title = html.escape(title[:58]); label = html.escape(label.upper())
            svg = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D1117"/><stop offset="1" stop-color="#111925"/></linearGradient><radialGradient id="g"><stop stop-color="{accent}" stop-opacity=".16"/><stop offset="1" stop-color="{accent}" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="650" rx="28" fill="url(#b)"/><rect width="1200" height="650" rx="28" fill="url(#g)"/><circle cx="88" cy="92" r="9" fill="{accent}"/><text x="115" y="102" fill="{accent}" font-family="Arial" font-size="24" font-weight="700" letter-spacing="3">{label}</text><text x="80" y="205" fill="#F5F7FA" font-family="Arial" font-size="52" font-weight="700">SEO</text><text x="80" y="270" fill="#F5F7FA" font-family="Arial" font-size="52" font-weight="700">INSIGHT</text><rect x="80" y="315" width="430" height="6" rx="3" fill="{accent}"/><text x="80" y="375" fill="#9AA9BD" font-family="Arial" font-size="23">{html.escape(label)} · article visual</text><text x="80" y="420" fill="#DDE5EF" font-family="Arial" font-size="20">{title}</text><rect x="700" y="155" width="360" height="300" rx="24" fill="#151C26" stroke="#2A3442"/>{motifs}<text x="80" y="575" fill="#65758A" font-family="Arial" font-size="16">JAVED CHAUDHARY · SEO &amp; WEBSITE GROWTH</text></svg>'''
            filename = 'blog-' + path.stem + '.svg'
            asset = root/'assests'/'images'/filename
            asset.write_text(svg, encoding='utf-8')
            return '/assests/images/' + filename

          for path in sorted(root.glob('blog/*/*.html')):
            if path.name == 'index.html' or len(path.parts) < 3 or path.parts[1] not in labels:
              continue
            label = labels[path.parts[1]]
            doc = path.read_text(encoding='utf-8')
            h1 = re.search(r'<h1[^>]*>(.*?)</h1>', doc, re.S)
            title = re.sub(r'<[^>]+>', '', h1.group(1)).strip() if h1 else path.stem.replace('-',' ')
            image = make_svg(path, title, label)
            figure = f'<figure class="blog-consistency-hero"><img src="{image}" width="1200" height="650" loading="eager" decoding="async" fetchpriority="high" title="{html.escape(title)}" alt="{html.escape(label + " visual related to " + title)}"><figcaption>{html.escape(label + ": a relevant visual supporting the article topic.")}</figcaption></figure>'
            doc = re.sub(r'<figure class="(?:heroimg|featured|blog-hero|blog-consistency-hero)">.*?</figure>', '', doc, flags=re.S)
            m = re.search(r'(<p[^>]*>.*?</p>)', doc, re.S)
            if m:
              doc = doc[:m.end()] + figure + doc[m.end():]
            else:
              doc = doc.replace('</main>', figure+'</main>', 1)
            doc = re.sub(r'(<article\b)(?![^>]*data-visuals-ready)', r'\1 data-visuals-ready="true"', doc, count=1)
            path.write_text(doc, encoding='utf-8')

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/*/*.html assests/images/blog-*.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix unique blog visuals and prevent duplicates [blog-normalized]"
          git push
