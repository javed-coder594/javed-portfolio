name: Build Reusable Blog Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[blog-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build 30 SEO articles from the master template
        run: python scripts/build_blog_library.py

      - name: Validate article library
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path('.')
          articles = []
          for p in root.glob('blog/*/*.html'):
              if p.name != 'index.html' and p.parts[1] in {'technical-seo','on-page-seo','off-page-seo','local-seo','wordpress-seo','web-development'}:
                  articles.append(p)
          if len(articles) != 30:
              raise SystemExit(f'Expected 30 articles, found {len(articles)}')
          for p in articles:
              text = p.read_text(encoding='utf-8')
              if len(re.findall(r'<h1\\b', text, re.I)) != 1:
                  raise SystemExit(f'{p}: must contain exactly one H1')
              if len(re.findall(r'<img\\b', text, re.I)) != 1:
                  raise SystemExit(f'{p}: must contain exactly one article image')
              if text.count('<div class="blog-faq-item">') != 5:
                  raise SystemExit(f'{p}: must contain exactly five FAQs')
          print('Validated 30 article pages with one H1, one image and five FAQs each.')

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/ assests/images/blog-*.svg sitemap.xml scripts/build_blog_library.py .github/workflows/normalize-blog-pages.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Standardize 30 SEO articles with unique focus keywords [blog-built]"
          git push
